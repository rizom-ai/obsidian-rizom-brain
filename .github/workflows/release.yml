name: Release

# Publishes the Rizom Brain plugin from its source in rizom-ai/brains
# (packages/obsidian-plugin): this repository's root files, and a release
# tagged with the manifest's version holding the built plugin. Obsidian
# reads the plugin from both. It runs only when started by hand.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and list what would be published, without publishing"
        type: boolean
        default: true
      ref:
        description: "The branch, tag or commit of rizom-ai/brains to build"
        type: string
        default: main

permissions: {}

jobs:
  # Installs and builds with no write access to anything: what a dependency
  # runs here cannot reach the release.
  build:
    name: Build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v5
        with:
          repository: rizom-ai/brains
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test and build the plugin
        working-directory: packages/obsidian-plugin
        run: |
          bun test
          bun run build
          bun scripts/public-repo.ts dist/public-repo

      - name: Read the version
        id: version
        working-directory: packages/obsidian-plugin
        run: |
          echo "version=$(bun -e 'console.log((await Bun.file("manifest.json").json()).version)')" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: List what would be published
        working-directory: packages/obsidian-plugin/dist
        run: |
          echo "Version ${{ steps.version.outputs.version }} from rizom-ai/brains@${{ steps.version.outputs.commit }}"
          echo "Repository root:"; ls -l public-repo
          echo "Release files:"; ls -l main.js manifest.json styles.css
          sha256sum main.js manifest.json styles.css

      - name: Keep the built files
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: |
            packages/obsidian-plugin/dist/main.js
            packages/obsidian-plugin/dist/manifest.json
            packages/obsidian-plugin/dist/styles.css
            packages/obsidian-plugin/dist/public-repo/
          if-no-files-found: error

  # Publishes the files the build made, and runs nothing else.
  publish:
    name: Publish
    needs: build
    if: ${{ !inputs.dry_run }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - name: Refuse a version that is already released
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version $VERSION is already released. Raise the version in packages/obsidian-plugin/manifest.json in rizom-ai/brains." >&2
            exit 1
          fi

      - name: Check out this repository
        uses: actions/checkout@v5

      - name: Fetch the built files
        uses: actions/download-artifact@v4
        with:
          name: plugin
          path: built

      - name: Update the repository's root files
        run: |
          cp built/public-repo/README.md built/public-repo/LICENSE built/public-repo/manifest.json built/public-repo/versions.json .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md LICENSE manifest.json versions.json
          if ! git diff --cached --quiet; then
            git commit -m "Rizom Brain $VERSION"
            git push
          fi

      - name: Release the built plugin
        run: |
          gh release create "$VERSION" built/main.js built/manifest.json built/styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes "Rizom Brain $VERSION. Built from https://github.com/rizom-ai/brains/tree/${SOURCE_COMMIT}/packages/obsidian-plugin."
